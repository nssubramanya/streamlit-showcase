[project]
name = "streamlit-demos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sushruth-subramanya", email = "sushruth.1902@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "streamlit>=1.30.0",
]

[project.scripts]
streamlit-demos = "streamlit_demos:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
